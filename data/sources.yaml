# Public data sources for the prototype.
# role: dev, test, demo, stretch, context, knowledge, reference
# demo: real public packages with no labels, for showing the tool (owner decision 2026-11-01).
# The test set is synthetic (scripts/make_cedar_falls.py), so no downloaded source is role test.
# kind: file (direct download) or landing_page (download attachments by hand)
# Raw files are never committed. Respect each owner's terms; use for testing only.

sources:

  mountain_regional_specs:
    role: dev
    kind: file
    url: https://www.mtnregionalwaterutah.gov/files/7ec6b0ee1/WTP_Optimization-MembraneProcurement_Specifications_FINAL.pdf
