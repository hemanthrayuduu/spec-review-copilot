[project]
name = "spec-review-copilot"
version = "0.1.0"
description = "Reads municipal water and wastewater bid packages and drafts compliance outputs for engineer review."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "numpy>=2.4.6",
    "openai>=1.99",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pint>=0.25.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.26",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "streamlit>=1.66.1",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
specreview = "spec_review.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket"
# PyMuPDF's SWIG bindings warn at import time on Python 3.11; nothing to act on.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
